# User API Documentation

paths:
  /api/v1/users/{id}:
    get:
      tags: [User]
      summary: Get a user's profile by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
          description: User account ID
      responses:
        200:
          description: User profile data
        404:
          description: User not found

    put:
      tags: [User]
      summary: Update a user's own profile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Profile updated successfully

  /api/v1/users:
    get:
      tags: [User]
      summary: List all users (paginated, filterable)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: gender
          schema: { type: string, enum: [Male, Female, Other] }
        - in: query
          name: minAge
          schema: { type: integer, minimum: 18 }
        - in: query
          name: maxAge
          schema: { type: integer, maximum: 100 }
        - in: query
          name: motherTongueId
          schema: { type: integer }
        - in: query
          name: search
          schema: { type: string }
      responses:
        200:
          description: Paginated list of users

  /api/v1/users/me:
    get:
      tags: [User]
      summary: Get the authenticated user's own profile
      security:
        - bearerAuth: []
      responses:
        200:
          description: Current user's profile
